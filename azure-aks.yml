apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-python-deployment
spec:
  replicas: 1 
  selector:
    matchLabels:
      app: my-python-app
  template:
    metadata:
      labels:
        app: my-python-app  
    spec:
      containers:
      - name: my-python-app
        image: dwititechacr.azurecr.io/mypython:latest
        ports:
        - containerPort: 8000

# LB
---
apiVersion: v1
kind: Service
metadata:
  name: my-python-svc
spec:
  type: LoadBalancer 
  selector:
    app: my-python-app 
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
